<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blowdown Buddy mascot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e2a47"/>
      <stop offset="1" stop-color="#123a63"/>
    </linearGradient>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f2fb"/>
      <stop offset="0.5" stop-color="#b9d4ee"/>
      <stop offset="1" stop-color="#8fb6dd"/>
    </linearGradient>
    <linearGradient id="valve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd15c"/>
      <stop offset="1" stop-color="#f5a623"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a8b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff9a8b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="steam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="72" fill="url(#bg)"/>

  <!-- decorative pressure curve -->
  <path d="M56 372 C 120 372, 150 372, 178 300 S 240 150, 300 150 L 456 150"
        fill="none" stroke="#2f6fb0" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.5"/>

  <!-- steam / blowdown puffs -->
  <g opacity="0.85">
    <circle cx="392" cy="150" r="20" fill="url(#steam)"/>
    <circle cx="418" cy="120" r="16" fill="url(#steam)"/>
    <circle cx="410" cy="176" r="13" fill="url(#steam)"/>
    <circle cx="446" cy="146" r="11" fill="url(#steam)"/>
  </g>

  <!-- outlet pipe from tank top -->
  <rect x="300" y="150" width="26" height="60" rx="8" fill="#6f8fb0"/>
  <!-- relief valve -->
  <path d="M296 150 h34 l-10 -26 h-14 z" fill="url(#valve)" stroke="#c98314" stroke-width="3"/>
  <rect x="304" y="112" width="18" height="16" rx="4" fill="#c98314"/>

  <!-- pressure gauge -->
  <circle cx="176" cy="196" r="30" fill="#f4f8fc" stroke="#6f8fb0" stroke-width="5"/>
  <circle cx="176" cy="196" r="4" fill="#123a63"/>
  <line x1="176" y1="196" x2="196" y2="180" stroke="#e5484d" stroke-width="4" stroke-linecap="round"/>

  <!-- tank body (the buddy) -->
  <rect x="150" y="190" width="212" height="240" rx="70" fill="url(#tank)" stroke="#5c86b3" stroke-width="6"/>

  <!-- feet -->
  <rect x="182" y="424" width="44" height="26" rx="12" fill="#5c86b3"/>
  <rect x="286" y="424" width="44" height="26" rx="12" fill="#5c86b3"/>

  <!-- arms -->
  <path d="M150 288 q-44 6 -52 44" fill="none" stroke="#5c86b3" stroke-width="14" stroke-linecap="round"/>
  <path d="M362 288 q44 6 52 44" fill="none" stroke="#5c86b3" stroke-width="14" stroke-linecap="round"/>

  <!-- face -->
  <g>
    <!-- cheeks -->
    <circle cx="205" cy="322" r="24" fill="url(#cheek)"/>
    <circle cx="307" cy="322" r="24" fill="url(#cheek)"/>
    <!-- eyes -->
    <circle cx="215" cy="296" r="16" fill="#0e2a47"/>
    <circle cx="297" cy="296" r="16" fill="#0e2a47"/>
    <circle cx="221" cy="290" r="5" fill="#ffffff"/>
    <circle cx="303" cy="290" r="5" fill="#ffffff"/>
    <!-- smile -->
    <path d="M212 336 q44 40 88 0" fill="none" stroke="#0e2a47" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- name label -->
  <g>
    <rect x="96" y="454" width="320" height="42" rx="21" fill="#ffd15c"/>
    <text x="256" y="483" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif"
          font-size="26" font-weight="700" fill="#0e2a47" letter-spacing="1">BLOWDOWN BUDDY</text>
  </g>
</svg>

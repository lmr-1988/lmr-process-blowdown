<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Blowdown Buddy mascot, Vault Boy style">
  <defs>
    <radialGradient id="bgGlow" cx="0.5" cy="0.38" r="0.75">
      <stop offset="0" stop-color="#2a6b2f"/>
      <stop offset="1" stop-color="#0e3a12"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="72" fill="url(#bgGlow)"/>

  <!-- decorative pressure/blowdown curve, thin retro scanline style -->
  <path d="M50 366 C 110 366, 140 366, 168 300 S 226 168, 284 168 L 462 168"
        fill="none" stroke="#ffd21f" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12" opacity="0.55"/>

  <!-- relief valve + steam puffs, Fallout-poster flat style -->
  <g fill="#ffd21f" opacity="0.9">
    <circle cx="392" cy="150" r="16"/>
    <circle cx="416" cy="122" r="12"/>
    <circle cx="408" cy="176" r="10"/>
    <circle cx="440" cy="146" r="9"/>
  </g>
  <rect x="300" y="150" width="22" height="42" rx="6" fill="#111111"/>
  <path d="M298 150 h30 l-9 -22 h-12 z" fill="#ffd21f" stroke="#111111" stroke-width="4"/>

  <!-- ===== VAULT-BOY STYLE CHARACTER ===== -->
  <g stroke="#111111" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">

    <!-- far arm, raised in thumbs-up, drawn behind torso/head -->
    <g fill="#2b6cb0">
      <!-- upper arm from shoulder up to elbow -->
      <path d="M300 268 C 328 258, 344 236, 344 210 L 322 202 C 320 224, 308 240, 288 250 Z"/>
      <!-- forearm continuing up beside head -->
      <path d="M330 214 C 340 196, 340 172, 328 154 L 306 160 C 314 176, 314 194, 306 208 Z"/>
    </g>
    <!-- fist with thumb up -->
    <g fill="#f4c98a">
      <rect x="300" y="122" width="30" height="34" rx="12"/>
      <rect x="306" y="98" width="14" height="30" rx="7"/>
    </g>

    <!-- near arm, down at side -->
    <path d="M196 274 C 168 288, 154 316, 158 348 C 160 362, 176 364, 182 350 L 194 296 Z" fill="#2b6cb0"/>

    <!-- legs (drawn before torso hem overlaps them) -->
    <rect x="212" y="392" width="34" height="70" rx="8" fill="#2b6cb0"/>
    <rect x="266" y="392" width="34" height="70" rx="8" fill="#2b6cb0"/>
    <!-- boots -->
    <rect x="204" y="452" width="50" height="24" rx="8" fill="#111111"/>
    <rect x="258" y="452" width="50" height="24" rx="8" fill="#111111"/>

    <!-- torso / jumpsuit -->
    <path d="M188 300
             C 188 258, 216 234, 256 234
             C 296 234, 324 258, 324 300
             L 330 410
             C 330 424, 182 424, 182 410
             Z" fill="#2b6cb0"/>

    <!-- jumpsuit collar -->
    <path d="M228 242 L 256 272 L 284 242" fill="none" stroke="#111111" stroke-width="6"/>

    <!-- torso zipper line -->
    <path d="M256 272 L 256 410" fill="none" stroke="#1c4f86" stroke-width="6"/>

    <!-- neck -->
    <rect x="240" y="216" width="32" height="26" fill="#f4c98a"/>

    <!-- head -->
    <circle cx="256" cy="176" r="62" fill="#f4c98a"/>

    <!-- ears -->
    <circle cx="196" cy="180" r="10" fill="#f4c98a" stroke="#111111" stroke-width="5"/>
    <circle cx="316" cy="180" r="10" fill="#f4c98a" stroke="#111111" stroke-width="5"/>

    <!-- hair, slicked side part -->
    <path d="M198 158 C 196 118, 232 96, 256 96 C 284 96, 316 118, 314 158
              C 300 140, 288 150, 272 138 C 258 128, 244 146, 226 140
              C 212 136, 204 146, 198 158 Z" fill="#111111"/>

    <!-- eyes, squinting happy -->
    <path d="M222 168 q14 -14 28 0" fill="none" stroke="#111111" stroke-width="6"/>
    <path d="M262 168 q14 -14 28 0" fill="none" stroke="#111111" stroke-width="6"/>

    <!-- nose -->
    <path d="M256 176 q-4 18 -12 22" fill="none" stroke="#111111" stroke-width="5"/>

    <!-- big grin -->
    <path d="M212 202 q44 40 88 0 q-44 -8 -88 0 Z" fill="#ffffff" stroke="#111111" stroke-width="6"/>
    <path d="M212 202 q44 40 88 0" fill="none" stroke="#111111" stroke-width="6"/>

    <!-- cheeks blush -->
    <circle cx="206" cy="196" r="10" fill="#ff8f6b" opacity="0.7" stroke="none"/>
    <circle cx="306" cy="196" r="10" fill="#ff8f6b" opacity="0.7" stroke="none"/>
  </g>

  <!-- name label, retro poster banner -->
  <g>
    <rect x="86" y="452" width="340" height="46" rx="10" fill="#ffd21f" stroke="#111111" stroke-width="5"/>
    <text x="256" y="483" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
          font-size="27" font-weight="700" fill="#111111" letter-spacing="1.5">BLOWDOWN BUDDY</text>
  </g>
</svg>
